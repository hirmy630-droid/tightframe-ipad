        function App() {

            const showToast = useCallback((msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2200);
            }, []);

            // テンキー入力ハンドラー
            const handleKeypadPress = (val) => {
                setTfTotalL((prev) => {
                    const clean = unformat(prev);
                    if (val === 'クリア') return '';
                    if (val === 'BS') return clean.slice(0, -1);
                    if (clean.length >= 8) return clean; // 最大桁数ガード
                    return clean + val;
                });
            };

            // 1文字削除（BS）
            const handleBackspace = () => {
                setTfTotalL(prev => unformat(prev).slice(0, -1));
            };

            // 設定の永続化
            useEffect(() => {
                localStorage.setItem('ipad_tf_size', tfSize);
            }, [tfSize]);

            useEffect(() => {
                localStorage.setItem('ipad_tf_total_l', tfTotalL);
            }, [tfTotalL]);

            // タイトフレーム割付のコア計算
            const tfResults = useMemo(() => {
                const size = parseInt(tfSize) || 600;
                const L = toNum(tfTotalL);
                let yamaDim = 0, taniDim = 0, calcSize = size;

                if (size === 600) { yamaDim = 200; taniDim = 100; calcSize = 600; }
                else if (size === 500) { yamaDim = 250; taniDim = 125; calcSize = 500; }
                else if (size === 1000) { yamaDim = 500; taniDim = 250; calcSize = 500; }

                if (L <= 0) {
                    return { centerL: '', yamaDim, taniDim, taniZan: '', yamaZan: '', table: [], count: 0, roofTaniCount: '', roofYamaCount: '', L: 0 };
                }

                const centerL = L / 2;
                const taniZan = excelMod(centerL, yamaDim);
                const yamaZan = excelMod(centerL - taniDim, yamaDim);

                let currentTani = taniZan;
                let currentYama = yamaZan;
                let table = [];
                let count = 0;

                while (currentTani <= L || currentYama <= L) {
                    table.push({
                        tani: (currentTani <= L && currentTani >= 0) ? currentTani : null,
                        yama: (currentYama <= L && currentYama >= 0) ? currentYama : null
                    });
                    currentTani += size;
                    currentYama += size;
                    count++;
                    if (count > 1200) break;
                }

                const roofTaniCount = Math.ceil((L + taniDim) / calcSize);
                const roofYamaCount = Math.ceil(L / calcSize);

                return { centerL, yamaDim, taniDim, taniZan, yamaZan, table, count, roofTaniCount, roofYamaCount, L };
            }, [tfSize, tfTotalL]);

    <script>
        // PWAのアップデート検知と自動リロード
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=202610010500').then((registration) => {
                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        if (!installingWorker) return;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // 新しいバージョンがインストールされたら古いSWを強制スキップ
                                installingWorker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        };
                    };
                }).catch((err) => console.log('SW Registration failed: ', err));
                
                // コントローラーが切り替わった（新しいバージョンがアクティブになった）ら自動リロード
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        window.location.reload();
                        refreshing = true;
                    }
                });
            });
        }
    </script>
</body>
