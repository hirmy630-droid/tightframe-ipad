        function App() {
            const [tfSize, setTfSize] = useState(() => localStorage.getItem('ipad_tf_size') || '600');
            const [tfTotalL, setTfTotalL] = useState(() => localStorage.getItem('ipad_tf_total_l') || '');
            const [toastMsg, setToastMsg] = useState('');

            const showToast = useCallback((msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2200);
            }, []);

            // テンキー入力ハンドラー
            const handleKeypadPress = (val) => {
                setTfTotalL((prev) => {
                    const clean = unformat(prev);
                    if (val === 'クリア') return '';
                    if (val === 'BS') return clean.slice(0, -1);
                    if (clean.length >= 8) return clean; // 最大桁数ガード
                    return clean + val;
                });
            };

            // 1文字削除（BS）
            const handleBackspace = () => {
                setTfTotalL(prev => unformat(prev).slice(0, -1));
            };

            // 設定の永続化
            useEffect(() => {
                localStorage.setItem('ipad_tf_size', tfSize);
            }, [tfSize]);

            useEffect(() => {
                localStorage.setItem('ipad_tf_total_l', tfTotalL);
            }, [tfTotalL]);

            // タイトフレーム割付のコア計算
            const tfResults = useMemo(() => {
                const size = parseInt(tfSize) || 600;
                const L = toNum(tfTotalL);
                let yamaDim = 0, taniDim = 0, calcSize = size;

                if (size === 600) { yamaDim = 200; taniDim = 100; calcSize = 600; }
                else if (size === 500) { yamaDim = 250; taniDim = 125; calcSize = 500; }
                else if (size === 1000) { yamaDim = 500; taniDim = 250; calcSize = 500; }

                if (L <= 0) {
                    return { centerL: '', yamaDim, taniDim, taniZan: '', yamaZan: '', table: [], count: 0, roofTaniCount: '', roofYamaCount: '', L: 0 };
                }

                const centerL = L / 2;
                const taniZan = excelMod(centerL, yamaDim);
                const yamaZan = excelMod(centerL - taniDim, yamaDim);

                let currentTani = taniZan;
                let currentYama = yamaZan;
                let table = [];
                let count = 0;

                while (currentTani <= L || currentYama <= L) {
                    table.push({
                        tani: (currentTani <= L && currentTani >= 0) ? currentTani : null,
                        yama: (currentYama <= L && currentYama >= 0) ? currentYama : null
                    });
                    currentTani += size;
                    currentYama += size;
                    count++;
                    if (count > 1200) break;
                }

                const roofTaniCount = Math.ceil((L + taniDim) / calcSize);
                const roofYamaCount = Math.ceil(L / calcSize);

                return { centerL, yamaDim, taniDim, taniZan, yamaZan, table, count, roofTaniCount, roofYamaCount, L };
            }, [tfSize, tfTotalL]);

            return (
                <div className="flex flex-col h-full bg-[#111113] text-zinc-100 overflow-hidden">
                    {/* トースト通知 */}
                    {toastMsg && (
                        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[300] bg-zinc-800/95 text-white px-5 py-2.5 rounded-full border border-zinc-600 shadow-2xl flex items-center gap-2.5 backdrop-blur-xl text-sm font-semibold">
                            <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                            {toastMsg}
                        </div>
                    )}

                    <header className="h-14 px-6 border-b border-white/10 bg-[#1c1c1e]/90 backdrop-blur-xl flex items-center justify-between shrink-0 z-40 select-none">
                        <div className="flex items-center gap-3">
                            <div className="w-3 h-3 rounded-full bg-[#0a84ff] shadow-sm"></div>
                            <h1 className="text-sm font-bold tracking-wide text-zinc-200 font-mono flex items-center gap-2">
                                <span className="text-orange-400 font-black">KYOWA ROOF</span>
                                <span className="text-zinc-600">/</span>
                                <span>屋根タイト割付計算</span>
                            </h1>
                        </div>

                        {/* タイト合計本数バッジ */}
                        <div className="flex items-center gap-3">
                            <div className="flex items-center gap-2 bg-[#252528] px-3.5 py-1.5 rounded-xl border border-white/10">
                                <span className="text-xs text-zinc-400 font-bold">タイト合計:</span>
                                <span className="text-base font-mono font-black text-orange-400">{tfResults.count} <span className="text-xs font-normal">本</span></span>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 p-4 lg:p-5 overflow-hidden">
                        <div className="h-full w-full max-w-[1400px] mx-auto grid grid-cols-12 gap-4 lg:gap-5">
                            
                            {/* 左カラム: 入力・テンキー・断面図・サマリーカード (5 / 12) */}
                            <div className="col-span-12 md:col-span-5 flex flex-col gap-3.5 overflow-y-auto pr-0.5 ipad-scroll">
                                
                                {/* 入力 & テンキー カード */}
                                <div className="ipad-card p-4 space-y-3">
                                    {/* パラメーター選択 & 全長芯 */}
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs text-zinc-400 font-bold mb-1.5 block">山ピッチ (タイプ)</label>
                                            <select 
                                                value={tfSize} 
                                                onChange={(e) => setTfSize(e.target.value)} 
                                                className="w-full bg-[#111113] border border-[#38383a] text-white rounded-xl px-3 py-2.5 text-sm font-semibold outline-none focus:border-[#0a84ff]"
                                            >
                                                <option value="600">600 (折板)</option>
                                                <option value="500">500 (H150)</option>
                                                <option value="1000">1000 (大型)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs text-zinc-400 font-bold mb-1.5 block">全長芯 (自動計算)</label>
                                            <div className="w-full bg-[#111113]/70 border border-[#2c2c2e] text-zinc-400 rounded-xl px-3 py-2.5 text-sm font-mono font-bold flex items-center justify-end">
                                                {tfResults.centerL !== '' ? `${format(tfResults.centerL)} mm` : '-'}
                                            </div>
                                        </div>
                                    </div>

                                    {/* 全長表示ディスプレイ（iPadのソフトキーボードを出さずテンキーで直感入力） */}
                                    <div className="pt-1">
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="text-xs text-zinc-400 font-bold">全長 (mm)</label>
                                            {tfTotalL && (
                                                <button 
                                                    type="button" 
                                                    onClick={handleBackspace} 
                                                    className="text-xs text-zinc-400 hover:text-white px-2 py-0.5 rounded bg-zinc-800/80 active:bg-zinc-700 flex items-center gap-1 font-mono font-semibold"
                                                >
                                                    ⌫ 1字消去
                                                </button>
                                            )}
                                        </div>
                                        <div className="w-full bg-[#111113] border-2 border-[#38383a] focus-within:border-orange-500 rounded-xl px-4 py-2.5 flex items-center justify-between">
                                            <span className="text-xs text-zinc-500 font-mono font-bold">LENGTH</span>
                                            <div className="font-mono text-2xl font-black text-orange-400 tracking-tight">
                                                {format(tfTotalL) || <span className="text-zinc-600 text-lg font-normal">全長を入力</span>}
                                                <span className="text-xs text-zinc-500 font-bold ml-1.5">mm</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* iPad最適化 3列シームレステンキー（指でタップしやすい56px高） */}
                                    <div className="pt-1.5">
                                        <div className="grid grid-cols-3 rounded-2xl overflow-hidden border border-white/10 shadow-lg bg-[#252528]">
                                            <button type="button" onClick={() => handleKeypadPress('7')} className="ipad-key">7</button>
                                            <button type="button" onClick={() => handleKeypadPress('8')} className="ipad-key">8</button>
                                            <button type="button" onClick={() => handleKeypadPress('9')} className="ipad-key">9</button>

                                            <button type="button" onClick={() => handleKeypadPress('4')} className="ipad-key">4</button>
                                            <button type="button" onClick={() => handleKeypadPress('5')} className="ipad-key">5</button>
                                            <button type="button" onClick={() => handleKeypadPress('6')} className="ipad-key">6</button>

                                            <button type="button" onClick={() => handleKeypadPress('1')} className="ipad-key">1</button>
                                            <button type="button" onClick={() => handleKeypadPress('2')} className="ipad-key">2</button>
                                            <button type="button" onClick={() => handleKeypadPress('3')} className="ipad-key">3</button>

                                            <button type="button" onClick={() => handleKeypadPress('0')} className="ipad-key">0</button>
                                            <button type="button" onClick={() => handleKeypadPress('00')} className="ipad-key">00</button>
                                            <button type="button" onClick={() => handleKeypadPress('クリア')} className="ipad-key ipad-key-fn" title="全クリア">クリア</button>
                                        </div>
                                    </div>
                                </div>

                                {/* 折板屋根 断面プロファイル表示 */}
                                <div className="ipad-card p-3.5 flex flex-col items-center justify-center bg-black/50 border border-white/10 select-none">
                                    <RoofProfileSVG size={tfSize} />
                                </div>

                                {/* 端部基準 & 屋根材枚数カード */}
                                <div className="grid grid-cols-2 gap-3 select-none">
                                    <div className="ipad-card p-3.5 border-l-4 border-l-[#0a84ff] bg-[#1c1c1e]">
                                        <span className="text-xs text-blue-400 font-bold block mb-1">谷芯 端部基準 (タイト)</span>
                                        <div className="text-2xl font-mono font-bold text-white mb-1">
                                            {tfResults.taniZan !== '' ? format(tfResults.taniZan) : '-'} <span className="text-xs font-normal text-zinc-400">mm</span>
                                        </div>
                                        <div className="text-xs text-zinc-400 font-mono">屋根材谷芯: <span className="text-blue-400 font-bold">{tfResults.roofTaniCount || '-'} 枚</span></div>
                                    </div>
                                    <div className="ipad-card p-3.5 border-l-4 border-l-[#30d158] bg-[#1c1c1e]">
                                        <span className="text-xs text-emerald-400 font-bold block mb-1">山芯 端部基準 (タイト)</span>
                                        <div className="text-2xl font-mono font-bold text-white mb-1">
                                            {tfResults.yamaZan !== '' ? format(tfResults.yamaZan) : '-'} <span className="text-xs font-normal text-zinc-400">mm</span>
                                        </div>
                                        <div className="text-xs text-zinc-400 font-mono">屋根材山芯: <span className="text-emerald-400 font-bold">{tfResults.roofYamaCount || '-'} 枚</span></div>
                                    </div>
                                </div>
                            </div>

                            {/* 右カラム: タイトフレーム割付位置 墨出し表 (7 / 12) */}
                            <div className="col-span-12 md:col-span-7 ipad-card flex flex-col overflow-hidden h-full select-none">
                                <div className="p-3.5 border-b border-white/10 flex justify-between items-center bg-[#252528] shrink-0">
                                    <span className="text-sm font-bold text-zinc-200 tracking-wide flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-orange-400"></span>
                                        タイトフレーム割付位置 墨出し表
                                    </span>
                                    <span className="text-xs font-mono font-bold text-orange-400 bg-orange-500/10 px-3 py-1 rounded-full border border-orange-500/20">
                                        全長: {format(tfTotalL) || 0} mm
                                    </span>
                                </div>

                                <div className="flex-1 ipad-scroll bg-[#171719]">
                                    <table className="w-full text-center border-collapse">
                                        <thead className="sticky top-0 bg-[#252528] border-b border-white/10 text-xs font-mono z-10 shadow-sm">
                                            <tr>
                                                <th className="py-3 px-3 text-zinc-400 font-bold w-16 border-r border-white/10">No.</th>
                                                <th className="py-3 px-4 text-[#0a84ff] font-bold border-r border-white/10 text-base">谷芯 (mm)</th>
                                                <th className="py-3 px-4 text-[#30d158] font-bold text-base">山芯 (mm)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="font-mono text-base divide-y divide-white/5">
                                            {tfResults.table.length === 0 ? (
                                                <tr>
                                                    <td colSpan="3" className="py-36 text-center text-zinc-500 italic font-semibold">
                                                        左側のテンキーで全長を入力してください
                                                    </td>
                                                </tr>
                                            ) : (
                                                tfResults.table.map((row, idx) => (
                                                    <tr key={idx} className="active:bg-white/10 hover:bg-white/5 transition-colors">
                                                        <td className="py-3 border-r border-white/5 text-zinc-400 font-bold text-sm bg-black/10">
                                                            {idx + 1}
                                                        </td>
                                                        <td className="py-3 border-r border-white/5 text-[#60a5fa] font-bold text-lg">
                                                            {row.tani !== null ? format(row.tani) : '-'}
                                                        </td>
                                                        <td className="py-3 text-[#4ade80] font-bold text-lg">
                                                            {row.yama !== null ? format(row.yama) : '-'}
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        // PWAのアップデート検知と自動リロード
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=202610010300').then((registration) => {
                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        if (!installingWorker) return;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // 新しいバージョンがインストールされたら古いSWを強制スキップ
                                installingWorker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        };
                    };
                }).catch((err) => console.log('SW Registration failed: ', err));
                
                // コントローラーが切り替わった（新しいバージョンがアクティブになった）ら自動リロード
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        window.location.reload();
                        refreshing = true;
                    }
                });
            });
        }
    </script>
</body>

</html>
